<div class="liste-livres">
  <h1 class="liste-livres-titre">Ma Bibliothèque</h1>

  <div class="filtres">
    <span class="filtres-titre">Genre :</span>
    <button class="btn-filtre" [class.actif]="genreSelectionne() === ''" (click)="selectionnerGenre('')">Tous</button>
    @for (genre of genres; track genre) {
      <button class="btn-filtre" [class.actif]="genreSelectionne() === genre" (click)="selectionnerGenre(genre)">{{ genre }}</button>
    }
  </div>

  <div class="filtres-lu">
    <button class="btn-filtre" [class.actif]="filtreLu() === 'tous'" (click)="setFiltreLu('tous')">Tous</button>
    <button class="btn-filtre" [class.actif]="filtreLu() === 'lu'" (click)="setFiltreLu('lu')">Lu</button>
    <button class="btn-filtre" [class.actif]="filtreLu() === 'nonlu'" (click)="setFiltreLu('nonlu')">Non lu</button>
  </div>

  <p class="compteur-resultats">{{ livresFiltres().length }} livre(s) trouvé(s)</p>

  <div class="grille-livres">
    @for (livre of livresFiltres(); track livre.id) {
      <app-livre-card [livre]="livre" />
    } @empty {
      <p class="message-vide">Aucun livre ne correspond à vos filtres</p>
    }
  </div>
</div>
