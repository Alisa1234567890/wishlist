<div class="card">
    <img
      class="poster"
      [src]="film.poster_path ? 'https://image.tmdb.org/t/p/w300' + film.poster_path : ''"
      [alt]="film.title"
    />
  
    <div class="content">
      <h3 class="title-film">{{ film.title }}</h3>
  
      <p class="year">
        {{ film.release_date?.slice(0,4) || 'N/A' }}
      </p>
  
      <button class="btn-remove" (click)="retirer.emit(film.id)">
        Retirer
      </button>
    </div>
  </div>
